<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>글러브 잡기</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12213f;font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#fff;overscroll-behavior:none}
  #app{position:relative;margin:0 auto;width:100%;max-width:430px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#16305f,#2a5a9a 60%,#3d7fb5);overflow:hidden}
  #hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;font-weight:800;flex:0 0 auto}
  .box{background:rgba(0,0,0,.35);border-radius:14px;padding:6px 12px;font-size:22px;line-height:1.1;white-space:nowrap}
  .box small{font-size:12px;opacity:.8;display:block;font-weight:600}
  #lives{letter-spacing:2px;color:#ff6b81}
  #stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;border-radius:12px;background:#1d4a85;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
  #controls{flex:0 0 auto;display:flex;gap:10px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));align-items:center}
  .mv{flex:1;height:64px;border:0;border-radius:18px;background:#e03a4e;color:#fff;font-size:34px;font-weight:900;box-shadow:0 5px 0 #9c1f30;touch-action:none;user-select:none;-webkit-user-select:none}
  .mv:active,.mv.on{transform:translateY(3px);box-shadow:0 2px 0 #9c1f30}
  #musicBtn{flex:0 0 auto;height:64px;padding:0 12px;border:0;border-radius:18px;background:rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:700}
  .overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;background:rgba(10,20,45,.88);z-index:5}
  .overlay.show{display:flex}
  .big{font-size:34px;font-weight:900;margin:0}
  .btn{border:0;border-radius:20px;padding:14px 36px;font-size:24px;font-weight:900;background:#e03a4e;color:#fff;box-shadow:0 6px 0 #9c1f30;cursor:pointer}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #9c1f30}
  #startScreen{background:linear-gradient(#16305f,#3d7fb5);justify-content:space-between;padding:16px 16px 24px}
  #poster{flex:1 1 auto;min-height:0;max-width:100%;object-fit:contain;border-radius:14px}
  #posterFallback{flex:1 1 auto;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
  #posterFallback .t{font-size:44px;font-weight:900;line-height:1.15}
  #endVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none;z-index:6}
  #endVideo.show{display:block}
  #endBtnWrap{position:absolute;left:0;right:0;bottom:30px;display:none;justify-content:center;z-index:7}
  #endBtnWrap.show{display:flex}
  .gold{color:#ffd54a}

  #loadScreen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;background:linear-gradient(#16305f,#3d7fb5);transition:opacity .45s}
  #loadScreen.done{opacity:0;pointer-events:none}
  #loadTitle{font-size:34px;font-weight:900;margin:0;text-align:center;line-height:1.15}
  #loadTrack{position:relative;width:100%;max-width:340px;height:150px}
  #loadRunner{position:absolute;bottom:22px;left:0;width:84px;height:auto;transform:translateX(-50%);transform-origin:50% 100%;pointer-events:none}
  #loadBar{position:absolute;left:0;right:0;bottom:0;height:18px;border-radius:12px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  #loadFill{height:100%;width:0;border-radius:12px;background:repeating-linear-gradient(45deg,#ff6b81 0 12px,#e03a4e 12px 24px)}
  #loadPct{font-size:20px;font-weight:800}
  .dust{position:absolute;bottom:20px;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none;animation:dust .6s ease-out forwards}
  @keyframes dust{to{transform:translate(-30px,-14px) scale(2);opacity:0}}
  #cheerBanner{position:absolute;left:0;right:0;bottom:92px;z-index:4;text-align:center;font-size:24px;font-weight:900;color:#ffd54a;text-shadow:0 2px 0 #9c1f30,0 0 8px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .25s}
  #cheerBanner.on{opacity:1}
  #cheerBanner span{display:inline-block;transition:transform .12s,color .12s}
  #cheerBanner span.hot{color:#fff;transform:scale(1.3) translateY(-4px)}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="box"><small>점수</small><span id="score">0</span> / 300</div>
    <div class="box"><small>목숨</small><span id="lives">♥♥♥♥♥</span></div>
  </div>
  <div id="stage"><canvas id="cv" width="360" height="520"></canvas></div>
  <div id="controls">
    <button class="mv" id="btnL" aria-label="왼쪽">◀</button>
    <button id="musicBtn">음악 끄기</button>
    <button class="mv" id="btnR" aria-label="오른쪽">▶</button>
  </div>

  <div id="startScreen" class="overlay show">
    <img id="poster" src="poster.png" alt="포스터">
    <div id="posterFallback"><div class="t">글러브<br>잡기</div><div>좌우로 움직여 글러브를 맞혀요!</div></div>
    <button class="btn" id="startBtn">시작</button>
  </div>

  <div id="overOverlay" class="overlay">
    <p class="big">게임 오버</p>
    <p id="overScore" style="font-size:20px;margin:0"></p>
    <button class="btn" id="retryBtn">다시 하기</button>
  </div>

  <div id="clearOverlay" class="overlay">
    <p class="big gold">클리어!</p>
    <p style="font-size:20px;margin:0">300점 달성!</p>
    <button class="btn" id="retryBtn2">다시 하기</button>
  </div>

    <div id="loadScreen">
    <p id="loadTitle">글러브<br>잡기</p>
    <div id="loadTrack">
      <canvas id="loadRunner" width="1" height="1"></canvas>
      <div id="loadBar"><div id="loadFill"></div></div>
    </div>
    <div id="loadPct">로딩중... 0%</div>
  </div>
  <div id="cheerBanner"></div>
  <video id="endVideo" src="ending.mp4" playsinline preload="none"></video>
  <div id="endBtnWrap"><button class="btn" id="retryBtn3">다시 하기</button></div>
  <audio id="bgm" src="music.mp3" loop preload="none"></audio>
</div>

  var SPR = {};
  Object.keys(SRC).forEach(function(k){
    var im = new Image();
    im.onerror = function(){ SPR[k] = null; };
    im.src = SRC[k];
    SPR[k] = im;
  });
  function ok(k){ var im = SPR[k]; return im && im.complete && im.naturalWidth > 0 ? im : null; }

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var $ = function(id){ return document.getElementById(id); };
  var scoreEl = $('score'), livesEl = $('lives');
  var startScreen = $('startScreen'), overOverlay = $('overOverlay'), clearOverlay = $('clearOverlay');
  var video = $('endVideo'), endBtnWrap = $('endBtnWrap'), bgm = $('bgm'), musicBtn = $('musicBtn');

  /* ---------- 상수 ---------- */
  var GOAL_HITS = 15, POINTS = 20, MAX_LIVES = 5;
  var RABBIT_Y = H - 56, RABBIT_SPEED = 260;
  var FIRE_EVERY = 0.4, BULLET_SPEED = 420;
  var GLOVE_SPEED = 55, SPAWN_EVERY = 1.1;
  var HIT_PAD = 10;               // 맞히기 판정 여유
  var HURT_RX = 10, HURT_RY = 20; // 부딪힘 판정(그림보다 작게)

  /* ---------- 상태 ---------- */
  var state = 'ready'; // ready | play | over | clear
  var x, targetX, score, hits, lives, invul, fireT, spawnT, t0;
  var bullets, gloves, parts, pops, stars = [];
  var keyL = false, keyR = false, btnL = false, btnR = false, dragging = false;
  var musicOn = true, last = 0;

  for (var i = 0; i < 40; i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.6+.4, v:Math.random()*14+6});

  function reset(){
    x = targetX = W/2; score = 0; hits = 0; lives = MAX_LIVES; invul = 0;
    fireT = 0.2; spawnT = 0.6; t0 = 0;
    bullets = []; gloves = []; parts = []; pops = [];
    updateHud();
  }
  function updateHud(){
    scoreEl.textContent = score;
    var s = ''; for (var i = 0; i < MAX_LIVES; i++) s += i < lives ? '♥' : '♡';
    livesEl.textContent = s;
  }

  /* ---------- 음악 ---------- */
  function playMusic(){
    if (!musicOn) return;
    if (window.Cheer) Cheer.start();
    try {
      var p = bgm.play();
      if (p && p.catch) p.catch(function(){});
    } catch(e){}
  }
  function stopMusic(){ try { bgm.pause(); } catch(e){} if (window.Cheer) Cheer.stop(); }
  bgm.addEventListener('error', function(){ musicBtn.style.display = 'none'; });
  musicBtn.addEventListener('click', function(){
    musicOn = !musicOn;
    if (musicOn){ musicBtn.textContent = '음악 끄기'; if (state === 'play') playMusic(); }
    else { musicBtn.textContent = '음악 켜기'; stopMusic(); }
  });

  /* ---------- 포스터 ---------- */
  $('poster').addEventListener('error', function(){
    $('poster').style.display = 'none';
    $('posterFallback').style.display = 'flex';
  });

  /* ---------- 시작/끝 ---------- */
  function startGame(){
    reset();
    startScreen.classList.remove('show');
    overOverlay.classList.remove('show');
    clearOverlay.classList.remove('show');
    hideVideo();
    state = 'play';
    playMusic();
  }
  function gameOver(){
    state = 'over';
    if (window.Cheer) Cheer.stop();
    $('overScore').textContent = '점수 ' + score + ' / 300';
    overOverlay.classList.add('show');
  }
  function hideVideo(){
    try { video.pause(); } catch(e){}
    video.classList.remove('show');
    endBtnWrap.classList.remove('show');
  }
  function showEndBtn(){ endBtnWrap.classList.add('show'); }
  function skipVideo(){
    if (state !== 'clear') return;
    hideVideo();
    clearOverlay.classList.add('show');
  }
  function clearGame(){
    state = 'clear';
    stopMusic();
    video.onended = showEndBtn;
    video.classList.add('show');
    try {
      video.currentTime = 0;
      var p = video.play();
      if (p && p.catch) p.catch(skipVideo);
    } catch(e){ skipVideo(); }
  }
  video.addEventListener('error', skipVideo);

  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);
  $('retryBtn2').addEventListener('click', startGame);
  $('retryBtn3').addEventListener('click', startGame);

  /* ---------- 입력 ---------- */
  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft'){ keyL = true; dragging = false; e.preventDefault(); }
    else if (e.key === 'ArrowRight'){ keyR = true; dragging = false; e.preventDefault(); }
  });
  window.addEventListener('keyup', function(e){
    if (e.key === 'ArrowLeft') keyL = false;
    else if (e.key === 'ArrowRight') keyR = false;
  });
  window.addEventListener('blur', function(){ keyL = keyR = btnL = btnR = false; });

  function holdBtn(el, setter){
    el.addEventListener('pointerdown', function(e){
      e.preventDefault(); setter(true); dragging = false; el.classList.add('on');
      try { el.setPointerCapture(e.pointerId); } catch(_){}
    });
    ['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(function(n){
      el.addEventListener(n, function(){ setter(false); el.classList.remove('on'); });
    });
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }
  holdBtn($('btnL'), function(v){ btnL = v; });
  holdBtn($('btnR'), function(v){ btnR = v; });

  function pointerToX(e){
    var r = cv.getBoundingClientRect();
    return (e.clientX - r.left) / r.width * W;
  }
  cv.addEventListener('pointerdown', function(e){
    dragging = true; targetX = clamp(pointerToX(e), 24, W-24);
    try { cv.setPointerCapture(e.pointerId); } catch(_){}
  });
  cv.addEventListener('pointermove', function(e){
    if (dragging) targetX = clamp(pointerToX(e), 24, W-24);
  });
  ['pointerup','pointercancel'].forEach(function(n){
    cv.addEventListener(n, function(){ dragging = false; });
  });

  function clamp(v,a,b){ return v < a ? a : v > b ? b : v; }

  /* ---------- 업데이트 ---------- */
  function update(dt){
    for (var i = 0; i < stars.length; i++){
      var s = stars[i]; s.y += s.v*dt; if (s.y > H){ s.y = 0; s.x = Math.random()*W; }
    }
    if (state !== 'play') return;
    t0 += dt;

    var dir = (keyL||btnL ? -1 : 0) + (keyR||btnR ? 1 : 0);
    if (dir){ x += dir*RABBIT_SPEED*dt; targetX = x; }
    else if (dragging){
      var d = targetX - x, step = RABBIT_SPEED*2.2*dt;
      x += Math.abs(d) < step ? d : Math.sign(d)*step;
    }
    x = clamp(x, 24, W-24);
    if (invul > 0) invul -= dt;

    // 자동 발사 (야구공)
    fireT -= dt;
    if (fireT <= 0){ fireT += FIRE_EVERY; bullets.push({x:x+8, y:RABBIT_Y-30, r:Math.random()*6}); }

    // 글러브 생성
    spawnT -= dt;
    if (spawnT <= 0){
      spawnT += SPAWN_EVERY + Math.random()*0.5;
      gloves.push({x:30+Math.random()*(W-60), y:-40, ph:Math.random()*6, v:Math.random()<.5?'gA':'gB'});
    }

    for (i = bullets.length-1; i >= 0; i--){
      bullets[i].y -= BULLET_SPEED*dt;
      if (bullets[i].y < -20) bullets.splice(i,1);
    }

    for (i = gloves.length-1; i >= 0; i--){
      var c = gloves[i];
      c.y += GLOVE_SPEED*dt;
      c.x += Math.sin(t0*1.4 + c.ph)*14*dt;
      if (c.y > H + 50){ gloves.splice(i,1); continue; }

      // 공으로 맞힘 (넉넉한 판정)
      var hit = false;
      for (var j = bullets.length-1; j >= 0; j--){
        var b = bullets[j];
        if (Math.abs(b.x - c.x) < 24 + HIT_PAD && Math.abs(b.y - c.y) < 24 + HIT_PAD){
          bullets.splice(j,1); hit = true; break;
        }
      }
      if (hit){
        gloves.splice(i,1);
        hits++; score += POINTS; updateHud(); if (window.Cheer) Cheer.hit();
        burst(c.x, c.y);
        pops.push({x:c.x, y:c.y, t:0, txt:'+' + POINTS});
        if (hits >= GOAL_HITS){ clearGame(); return; }
        continue;
      }

      // 주인공과 부딪힘 (작은 판정)
      if (invul <= 0){
        var dx = (c.x - x)/(HURT_RX + 14), dy = (c.y - RABBIT_Y)/(HURT_RY + 14);
        if (dx*dx + dy*dy < 1){
          gloves.splice(i,1);
          lives--; invul = 1.5; updateHud();
          burst(c.x, c.y, '#ff6b81');
          if (lives <= 0){ gameOver(); return; }
        }
      }
    }

    for (i = parts.length-1; i >= 0; i--){
      var p = parts[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 300*dt; p.t -= dt;
      if (p.t <= 0) parts.splice(i,1);
    }
    for (i = pops.length-1; i >= 0; i--){
      pops[i].t += dt; pops[i].y -= 40*dt;
      if (pops[i].t > 0.8) pops.splice(i,1);
    }
  }
  function burst(px, py, col){
    for (var i = 0; i < 12; i++){
      var a = Math.random()*Math.PI*2, v = 60 + Math.random()*140;
      parts.push({x:px, y:py, vx:Math.cos(a)*v, vy:Math.sin(a)*v-60, t:0.5+Math.random()*0.3,
                  c: col || (Math.random() < .5 ? '#ffd54a' : '#ffffff')});
    }
  }

  /* ---------- 그리기 ---------- */
  function drawGlove(c){
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(Math.sin(t0*2 + c.ph)*0.12);
    var im = ok(c.v);
    if (im) ctx.drawImage(im, -30, -30, 60, 60*im.naturalHeight/im.naturalWidth);
    else { ctx.fillStyle = '#9a5a2b'; ctx.fillRect(-26,-24,52,48); }
    ctx.restore();
  }
  function drawHero(){
    if (invul > 0 && Math.floor(invul*10) % 2 === 0) return; // 깜빡임
    var im = ok('hero'), bob = Math.sin(performance.now()/120)*1.2;
    ctx.save(); ctx.translate(x, RABBIT_Y + bob);
    if (im){ var hh = 84, ww = hh*im.naturalWidth/im.naturalHeight; ctx.drawImage(im, -ww/2, -hh/2 - 4, ww, hh); }
    else { ctx.fillStyle = '#fff'; ctx.fillRect(-14,-36,28,72); }
    ctx.restore();
  }
  function draw(){
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#16305f'); g.addColorStop(1,'#2f6aa6');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    stars.forEach(function(s){ ctx.fillRect(s.x, s.y, s.s, s.s); });
    // 잔디
    ctx.fillStyle = '#3f8f4a'; ctx.fillRect(0,H-12,W,12);
    ctx.fillStyle = '#56b062'; ctx.fillRect(0,H-12,W,3);

    gloves.forEach(drawGlove);
    var bi = ok('ball');
    bullets.forEach(function(b){
      if (bi){ ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r + b.y/25); ctx.drawImage(bi,-11,-11,22,22); ctx.restore(); }
      else { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,8,0,7); ctx.fill(); }
    });
    drawHero();
    parts.forEach(function(p){
      ctx.globalAlpha = Math.max(0, p.t*2); ctx.fillStyle = p.c;
      ctx.fillRect(p.x-2.5, p.y-2.5, 5, 5);
    });
    ctx.globalAlpha = 1;
    ctx.font = '900 22px system-ui,sans-serif'; ctx.textAlign = 'center';
    pops.forEach(function(p){
      ctx.globalAlpha = 1 - p.t/0.8; ctx.fillStyle = '#ffd54a';
      ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 3;
      ctx.strokeText(p.txt, p.x, p.y); ctx.fillText(p.txt, p.x, p.y);
    });
    ctx.globalAlpha = 1;
    // 진행 바
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(10,8,W-20,8);
    ctx.fillStyle = '#ffd54a'; ctx.fillRect(10,8,(W-20)*(hits/GOAL_HITS),8);
  }

  /* ---------- 루프 / 크기 ---------- */
  function loop(ts){
    var dt = Math.min(0.05, (ts - last)/1000 || 0); last = ts;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  function resize(){
    var st = $('stage'), aw = st.clientWidth - 16, ah = st.clientHeight - 8;
    var w = Math.max(100, Math.min(aw, ah*W/H));
    cv.style.width = w + 'px'; cv.style.height = (w*H/W) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>

  var MIN_MS=2800;
  var screenEl=document.getElementById('loadScreen'), fill=document.getElementById('loadFill'),
      pct=document.getElementById('loadPct'), runner=document.getElementById('loadRunner'),
      track=document.getElementById('loadTrack');
  var ready=false, startT=performance.now(), shown=0, finished=false, lastDust=0;

  /* 캐릭터(달리는 포즈)를 시트에서 잘라 체크무늬 배경 제거 */
  var sheet=new Image();
  sheet.onload=function(){
    try{
      var sx=360,sy=385,sw=205,sh=315;
      var c=runner, g=c.getContext('2d');
      c.width=sw; c.height=sh;
      g.drawImage(sheet,sx,sy,sw,sh,0,0,sw,sh);
      var d=g.getImageData(0,0,sw,sh), p=d.data, seen=new Uint8Array(sw*sh), q=[];
      function bg(i){var r=p[i*4],gg=p[i*4+1],b=p[i*4+2],mx=Math.max(r,gg,b),mn=Math.min(r,gg,b);return mn>185&&mx-mn<28;}
      function push(x,y){var i=y*sw+x;if(!seen[i]&&bg(i)){seen[i]=1;q.push(i);}}
      for(var x=0;x<sw;x++){push(x,0);push(x,sh-1);}
      for(var y=0;y<sh;y++){push(0,y);push(sw-1,y);}
      while(q.length){var i=q.pop(),x=i%sw,y=(i-x)/sw;p[i*4+3]=0;
        if(x>0)push(x-1,y);if(x<sw-1)push(x+1,y);if(y>0)push(x,y-1);if(y<sh-1)push(x,y+1);}
      g.putImageData(d,0,0);
    }catch(e){}
  };
  sheet.src=RUNNER_SRC;

  /* 실제 리소스(이미지 등) 로딩 완료 대기 */
  function markReady(){ready=true;}
  if(document.readyState==='complete') markReady(); else window.addEventListener('load',markReady);
  setTimeout(markReady,8000);

  function frame(now){
    if(finished) return;
    var t=now-startT, target=Math.min(t/MIN_MS,1)*100;
    if(!ready) target=Math.min(target,92);
    shown+=(target-shown)*0.18;
    if(target>=100&&shown>99.5) shown=100;
    var w=track.clientWidth, px=Math.max(0.05,shown/100)*w;
    fill.style.width=shown+'%';
    pct.textContent='로딩중... '+Math.floor(shown)+'%';
    var run=t/1000;
    var bob=Math.abs(Math.sin(run*11))*14;
    runner.style.left=Math.max(px,40)+'px';
    runner.style.transform='translateX(-50%) translateY('+(-bob)+'px) rotate('+(Math.sin(run*11)*4)+'deg)';
    if(now-lastDust>130&&shown<100){
      lastDust=now;
      var d=document.createElement('div');d.className='dust';
      d.style.left=(Math.max(px,40)-38)+'px';track.appendChild(d);
      setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},620);
    }
    if(shown>=100&&ready){
      finished=true; pct.textContent='준비 완료!';
      setTimeout(function(){screenEl.classList.add('done');setTimeout(function(){screenEl.style.display='none';},500);},350);
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

<script>
/* 야구 응원가: 직접 만든 리듬 + 가사 "어썸주원 안타날려버려~" */
window.Cheer=(function(){
  var LYRICS=['어','썸','주','원','!','안','타','날','려','버','려','~'];
  var BPM=124, BEAT=60/BPM, LOOP_BEATS=8;
  var ac=null, master=null, running=false, timer=null, nextT=0, cycle=0, banner=document.getElementById('cheerBanner');
  var timeouts=[];
  function ctx(){
    if(!ac){
      try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=0.5; master.connect(ac.destination); }catch(e){ac=null;}
    }
    if(ac&&ac.state==='suspended') ac.resume();
    return ac;
  }
  function tone(f,t,d,type,v){
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'triangle'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||0.25,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+d+0.02);
  }
  function noise(t,d,v,hp){
    var n=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), x=b.getChannelData(0);
    for(var i=0;i<n;i++) x[i]=Math.random()*2-1;
    var s=ac.createBufferSource(); s.buffer=b;
    var f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||1500;
    var g=ac.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  function stomp(t){ var o=ac.createOscillator(),g=ac.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
    g.gain.setValueAtTime(0.7,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.2); }
  function clap(t){ noise(t,0.09,0.5,1800); }

  /* 8박 한 바퀴: 쿵쿵 짝 / 쿵쿵 짝짝짝 */
  var NOTE={C:523.25,D:587.33,E:659.25,G:783.99,A:880};
  /* [박, 음, 글자 인덱스] 직접 만든 단순한 오음계 멜로디 */
  var MEL=[[0,'E',0],[0.5,'E',1],[1,'G',2],[1.5,'A',3],[2,'G',4],
           [4,'E',5],[4.5,'G',6],[5,'A',7],[5.5,'A',8],[6,'G',9],[6.5,'E',10],[7,'D',11]];
  var STOMP=[0,1,4,5], CLAP=[2,3,6,6.5,7];

  function lyricHtml(){ banner.innerHTML=LYRICS.map(function(c,i){return '<span>'+c+'</span>';}).join(''); }
  function hot(i,delay){
    timeouts.push(setTimeout(function(){
      var s=banner.children; for(var k=0;k<s.length;k++) s[k].classList.remove('hot');
      if(running&&s[i]) s[i].classList.add('hot');
    },Math.max(0,delay*1000)));
  }
  function speak(){
    try{
      var ss=window.speechSynthesis; if(!ss) return;
      ss.cancel();
      var u=new SpeechSynthesisUtterance('어썸주원! 안타 날려버려!');
      u.lang='ko-KR'; u.rate=1.15; u.pitch=1.4; u.volume=0.9;
      ss.speak(u);
    }catch(e){}
  }
  function schedule(t0){
    STOMP.forEach(function(b){stomp(t0+b*BEAT);});
    CLAP.forEach(function(b){clap(t0+b*BEAT);});
    for(var b=0;b<LOOP_BEATS;b++) if(b%1===0) noise(t0+(b+0.5)*BEAT,0.04,0.12,6000);
    MEL.forEach(function(m){ tone(NOTE[m[1]],t0+m[0]*BEAT,BEAT*0.45,'triangle',0.22); hot(m[2],t0+m[0]*BEAT-ac.currentTime); });
    var d=t0-ac.currentTime; timeouts.push(setTimeout(speak,Math.max(0,d*1000)));
  }
  function pump(){
    if(!running||!ac) return;
    while(nextT<ac.currentTime+0.6){ schedule(nextT); nextT+=LOOP_BEATS*BEAT; cycle++; }
  }
  return {
    start:function(){
      if(running) return;
      if(!ctx()||!banner) return;
      running=true; lyricHtml(); banner.classList.add('on');
      nextT=ac.currentTime+0.3; pump(); timer=setInterval(pump,200);
    },
    stop:function(){
      running=false; clearInterval(timer);
      timeouts.forEach(clearTimeout); timeouts=[];
      try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}
      if(banner) banner.classList.remove('on');
    },
    hit:function(){
      if(!running||!ac) return;
      var t=ac.currentTime;
      tone(NOTE.G,t,0.1,'square',0.12); tone(NOTE.A,t+0.08,0.1,'square',0.12); tone(1046.5,t+0.16,0.18,'square',0.12);
    }
  };
})();
